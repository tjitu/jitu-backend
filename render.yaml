services:
  - type: web
    name: jitu-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: FIREBASE_PROJECT_ID
        value: jitu-ptn-main-auth-2026
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MERCHANT_ID
        sync: false
      - key: CLIENT_KEY
        sync: false
      - key: SERVER_KEY
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_INTERNAL_API_KEY
        sync: false
