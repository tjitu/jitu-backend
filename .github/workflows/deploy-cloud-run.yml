name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run Prisma migrations before deploying
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-backend
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/jitu-backend:${{ github.sha }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test --runInBand

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: docker build --tag "$IMAGE" .

      - name: Push image
        run: docker push "$IMAGE"

      - name: Run Prisma migrations
        if: ${{ inputs.run_migrations }}
        run: |
          DATABASE_URL="$(gcloud secrets versions access latest --secret=backend-database-url --project="${{ vars.GCP_PROJECT_ID }}")" pnpm prisma migrate deploy

      - name: Deploy Cloud Run service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.BACKEND_CLOUD_RUN_SERVICE }}
          image: ${{ env.IMAGE }}
          env_vars: |-
            NODE_ENV=production
            HOST=0.0.0.0
            PORT=8080
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID || 'jitu-ptn-main-auth-2026' }}
            FRONTEND_URL=${{ vars.FRONTEND_URL }}
            BETTER_AUTH_URL=${{ vars.BACKEND_URL }}
            ALLOWED_ORIGINS=${{ vars.FRONTEND_URL }}
            TRUSTED_ORIGINS=${{ vars.FRONTEND_URL }}
            AI_SERVICE_URL=${{ vars.AI_SERVICE_URL }}
            SMTP_PORT=587
            SMTP_SECURE=false
          secrets: |-
            DATABASE_URL=backend-database-url:latest
            BETTER_AUTH_SECRET=backend-better-auth-secret:latest
            GOOGLE_CLIENT_ID=google-client-id:latest
            GOOGLE_CLIENT_SECRET=google-client-secret:latest
            CLOUDINARY_NAME=cloudinary-cloud-name:latest
            CLOUDINARY_CLOUD_NAME=cloudinary-cloud-name:latest
            CLOUDINARY_API_KEY=cloudinary-api-key:latest
            CLOUDINARY_API_SECRET=cloudinary-api-secret:latest
            SMTP_HOST=smtp-host:latest
            SMTP_USER=smtp-user:latest
            SMTP_PASS=smtp-pass:latest
            SMTP_FROM=smtp-from:latest
            MERCHANT_ID=midtrans-merchant-id:latest
            CLIENT_KEY=midtrans-client-key:latest
            SERVER_KEY=midtrans-server-key:latest
            AI_SERVICE_INTERNAL_API_KEY=ai-internal-api-key:latest
          flags: >-
            --port=8080
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=10
            --timeout=300

      - name: Print service URL
        run: echo "${{ steps.deploy.outputs.url }}"
